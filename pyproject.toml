[tool.poetry]
name = "skytrade-smallcap"
version = "0.1.0"
description = "SkyTrade: an NSE F&O trading-signal scanner and paper-trading engine."
authors = ["Shashikant Chauhan <hardrock.chauhan@gmail.com>"]
readme = "README.md"
# Internal package/module path stays "trading_scanner" -- renaming it would
# touch every import across the codebase plus the live VPS deployment paths
# (systemd service, crontab) for no functional benefit; only the outward
# product identity (repo name, this metadata, dashboard UI) is "SkyTrade".
packages = [{ include = "trading_scanner", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
apscheduler = "^3.10.4"
httpx = "^0.27.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
yfinance = "^0.2.43"
pandas = "^2.2.3"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
numpy = "^2.1.2"
libsql-client = "^0.3.1"
fastapi = "^0.115.0"
uvicorn = "^0.31.0"
kiteconnect = "^5.0.1"
vollib = "^1.0.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"

# Only train_ranking_model.py needs these -- kept out of the default install
# (and off the VPS) since nothing in the live pipeline imports them; the
# live ranking gate (application/ranking.py) only ever loads this group's
# *output* (a saved model file), never these packages themselves.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
catboost = "^1.2.7"
scikit-learn = "^1.5.2"

[tool.poetry.scripts]
trading-scanner = "trading_scanner.main:main"
trading-scanner-signals = "trading_scanner.signals:main"
trading-scanner-dashboard = "trading_scanner.webapp:main"
trading-scanner-live = "trading_scanner.live_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# alpha_engine.py is a faithful 1:1 Pine Script translation and must never be
# modified (see README's hard constraints) -- excluded here rather than
# reformatted so CI can pass without touching it.
extend-exclude = ["src/trading_scanner/alpha_engine.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
