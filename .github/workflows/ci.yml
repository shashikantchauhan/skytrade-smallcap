name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "1.8.4"
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run pytest

  deploy:
    # 2026-08-14: adapted from the parent p-trade repo's deploy job for this
    # fork's different architecture -- there is no long-running service to
    # restart here (no live_pipeline.py/p-trade-live in this fork, see
    # README's "What's different" section), just a daily crontab entry that
    # re-runs trading_scanner.signals against whatever code is checked out.
    # So "deploy" here is only a git pull -- the next scheduled cron run
    # picks up new code automatically, nothing to restart.
    #
    # Inert until this repo has its own DEPLOY_HOST/DEPLOY_USER/
    # DEPLOY_SSH_KEY secrets set (deliberately not configured yet -- ssh
    # access to the VPS is real production access, not something to wire up
    # silently as a side effect of a rename/fork). Until then this step
    # fails harmlessly (empty secrets -> ssh-action can't connect) rather
    # than doing nothing silently, so it's obvious it needs setup rather
    # than looking like it's working.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/skytrade-smallcap
            git pull origin main --ff-only
